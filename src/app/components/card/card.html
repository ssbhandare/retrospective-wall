<div class="card" (dblclick)="editCard()">

    {{ card.text }}

</div>

@if (selectedCard) {

<div class="modal fade show d-block" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Edit Card
                </h5>

                <button type="button" class="btn-close" (click)="selectedCard = null">
                </button>

            </div>

            <div class="modal-body">

                <textarea class="form-control" rows="5" [(ngModel)]="editedText">
                </textarea>

            </div>

            <div class="modal-footer">

                <button type="button" class="btn btn-secondary" (click)="selectedCard = null">

                    Cancel

                </button>

                <button type="button" class="btn btn-success" (click)="saveEditedCard()">

                    Save

                </button>

            </div>

        </div>

    </div>

</div>

<div class="modal-backdrop fade show"></div>

}
